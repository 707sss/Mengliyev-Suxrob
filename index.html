    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);

  @keyframes rotateSpin { to { transform: rotate(360deg); } }
  .ava-photo {

  .ava-photo img {

  .name { font-size: 21px; font-weight: 700; color: #fff; text-align: center; }

  .card {

    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px; padding: 13px 18px;
    display: flex; align-items: center; gap: 13px;
    text-decoration: none; color: #fff;
    transition: background .18s, transform .14s, border-color .18s;
    backdrop-filter: blur(8px);
  }
  .card:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.16); transform: translateY(-2px); }
  .card:active { transform: scale(0.975); }

  .ico { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex-shrink: 0; }

  .card-body { flex: 1; }

  .card-sub { font-size: 11.5px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .card-arr { color: rgba(255,255,255,0.25); font-size: 18px; }

  .two-col { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }

  .mini-card {

<script>
(function(){
  var c = document.getElementById("stars-canvas");
  var ctx = c.getContext("2d");
  var stars = [];
  function resize(){
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    stars = [];
    for(var i=0;i<220;i++){
      stars.push({
        x: Math.random()*c.width,
        y: Math.random()*c.height,
        r: Math.random()*1.3+0.15,
        phase: Math.random()*Math.PI*2,
        spd: Math.random()*0.007+0.002
      });
    }
  }
  var t=0;
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var a=0.1+0.75*Math.abs(Math.sin(s.phase+t*s.spd));
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle="rgba(210,190,255,"+a.toFixed(2)+")";
      ctx.fill();
    }
    t++;
    requestAnimationFrame(draw);
  }
  window.addEventListener("resize",resize);
  resize();
  draw();
})();
</script>
